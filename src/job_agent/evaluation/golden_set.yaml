# Golden set for `job-agent eval` — 24 job postings with human ground-truth
# labels relative to the baked-in demo profile (see demo_profile.py).
#
# expected: strong | good | maybe | skip   (human judgment, NOT matcher output)
# posted_days_ago: relative age, resolved to posted_at at load time so
#                  age-based risk cases never go stale.
#
# Some cases are deliberate borderline cases (see notes) — the eval is meant
# to surface where the deterministic rubric and human judgment diverge.

- job:
    id: gold-01
    source: manual
    source_id: gold-01
    url: https://example.de/golden/g01
    title: Werkstudent KI (m/w/d)
    company: RuhrTech GmbH
    location: Gelsenkirchen
    description: >-
      Du unterstützt unser Team beim Aufbau von LLM-Anwendungen für
      Industriekunden. Sehr gute Deutschkenntnisse sind erwünscht, die
      Dokumentation entsteht auf Deutsch. Flexible Arbeitszeiten neben dem
      Studium.
    requirements: [python, llms]
    nice_to_have: [rag]
    employment_type: working-student
    remote: false
  expected: strong
  note: "Volltreffer: Skills, Standort, Jobtyp und Sprache passen."

- job:
    id: gold-02
    source: manual
    source_id: gold-02
    url: https://example.de/golden/g02
    title: Data Engineer (Vollzeit)
    company: Isar Analytics
    location: München
    description: >-
      Sie entwickeln und betreiben Datenpipelines für unsere Kunden in
      München. Präsenz im Büro an drei Tagen pro Woche wird erwartet. Sehr
      gute Deutschkenntnisse setzen wir voraus.
    requirements: [python, sql]
    employment_type: full-time
  expected: good
  note: >-
    Bewusster Grenzfall: Skills perfekt, aber Vollzeit in München passt nicht
    zum Studierendenprofil — ein Mensch stuft das eher herab.


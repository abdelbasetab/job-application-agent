[project]
name = "job-application-agent"
version = "0.1.0"
description = "Multi-agent system that finds jobs, matches them to a profile, drafts tailored applications, and tracks status."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abdelbaset Abidi" },
]
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",

    # Agents (added once Scout is implemented; safe to install now)
    "crewai>=0.51",
    "crewai-tools>=0.8",
    # LiteLLM powers CrewAI's LLM routing (needed for non-native models like
    # the KI-Connect 'Mistral Small 4 119B' via the openai-compatible gateway).
    "litellm>=1.40",

    # LLM clients (Sprint 1 uses one; Sprint 2 adds more)
    "openai>=1.30",

    # Storage
    "chromadb>=0.5",

    # Sprint 3: CV ingestion (PDF text + OCR for scans) + YAML profile loading
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pyyaml>=6.0",

    # PDF export (German application package) — lightweight, pure Python
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Optional: assisted browser import for login-gated boards (Indeed/StepStone/XING).
# After install run: playwright install chromium
browser = [
    "playwright>=1.40",
]

[project.scripts]
job-agent = "job_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: exercises a real external service (Ollama, Adzuna, …). Skipped by default; run with `pytest -m integration`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

# CrewAI ships no type stubs and is imported lazily — its decorator/typing
# noise depends on whether the package is installed, so silence exactly the
# affected codes in exactly this module (everything else stays strict).
[[tool.mypy.overrides]]
module = "job_agent.agents.scout"
disable_error_code = ["untyped-decorator", "unused-ignore"]

[project]
name = "job-application-agent"
version = "1.0.0"
description = "Multi-agent system that finds jobs, matches them to a profile, drafts tailored applications, and tracks status."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abdelbaset Abidi" },
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    # Core
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
    "cryptography>=48,<50",
    "rich>=14,<15",
    "typer>=0.23,<1",

    # CV ingestion (PDF text + OCR for scans) + YAML profile loading
    "pdfplumber>=0.11.9,<1",
    "python-docx>=1.2,<2",
    "pyyaml>=6.0,<7",

    # PDF export (German application package) — lightweight, pure Python
    "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "mypy>=2,<3",
]
# Optional: browser-backed deep liveness check for individual public job URLs.
# The core HTTP check remains available without this extra.
liveness = [
    "playwright>=1.61,<2",
]

[project.scripts]
job-agent = "job_agent.main:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: exercises a real external service (Ollama, Adzuna, …). Skipped by default; run with `pytest -m integration`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

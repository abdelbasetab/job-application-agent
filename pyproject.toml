[project]
name = "job-application-agent"
version = "0.1.0"
description = "Multi-agent system that finds jobs, matches them to a profile, drafts tailored applications, and tracks status."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abdelbaset Abidi" },
]
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",

    # Agents (added once Scout is implemented; safe to install now)
    "crewai>=0.51",
    "crewai-tools>=0.8",

    # LLM clients (Sprint 1 uses one; Sprint 2 adds more)
    "openai>=1.30",

    # Storage
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
job-agent = "job_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: exercises a real external service (Ollama, Adzuna, …). Skipped by default; run with `pytest -m integration`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

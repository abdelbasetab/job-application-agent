# Local run of the multi-user web UI. For public deployment, put an HTTPS
# reverse proxy in front and set WEB_SECURE_COOKIES=true.
services:
  web:
    build:
      context: .
      target: runtime
    image: job-application-agent:latest
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-7860}:7860"
    environment:
      WEB_SECURE_COOKIES: "${WEB_SECURE_COOKIES:-false}"
      WEB_ALLOW_REGISTRATION: "${WEB_ALLOW_REGISTRATION:-false}"
    env_file:
      - path: .env
        required: false
    volumes:
      - job_agent_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  job_agent_data:
